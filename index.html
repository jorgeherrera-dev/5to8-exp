<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 English Idioms Game · Adivina el Significado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00cec9;
            --dark: #2d3436;
            --light: #dfe6e9;
            --warning: #fdcb6e;
            --success: #00b894;
            --danger: #e17055;
            --pink: #fd79a8;
        }

        body {
            background: linear-gradient(135deg, #0c0c1d, #1a1a3e, #0c0c1d);
            color: var(--light);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.08); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(5px); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes correctGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 184, 148, 0.6); }
            50% { box-shadow: 0 0 35px rgba(0, 184, 148, 1), 0 0 70px rgba(0, 184, 148, 0.5); }
        }

        @keyframes wrongMark {
            0% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }

        @keyframes successPop {
            0% { transform: scale(1); }
            30% { transform: scale(1.3); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes rainbowBorder {
            0% { border-color: #ff6b6b; }
            25% { border-color: #feca57; }
            50% { border-color: #48dbfb; }
            75% { border-color: #ff9ff3; }
            100% { border-color: #54a0ff; }
        }

        .start-screen {
            gap: 2rem;
            padding: 2rem;
        }

        .game-logo {
            font-size: 5rem;
            animation: float 3s infinite ease-in-out;
            filter: drop-shadow(0 10px 20px rgba(108, 92, 231, 0.5));
        }

        .game-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--secondary), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: var(--light);
            opacity: 0.8;
            max-width: 500px;
            line-height: 1.6;
        }

        .idioms-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            max-width: 600px;
        }

        .idiom-chip {
            background: rgba(108, 92, 231, 0.2);
            border: 1px solid var(--secondary);
            border-radius: 30px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            color: var(--secondary);
            animation: float 2s infinite ease-in-out;
        }
        .idiom-chip:nth-child(2) { animation-delay: 0.3s; }
        .idiom-chip:nth-child(3) { animation-delay: 0.6s; }
        .idiom-chip:nth-child(4) { animation-delay: 0.9s; }
        .idiom-chip:nth-child(5) { animation-delay: 1.2s; }

        .btn {
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(108, 92, 231, 0.7); }
        .btn-primary:active { transform: scale(0.95); }
        .btn-next {
            background: linear-gradient(135deg, var(--success), #55efc4);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.5);
            animation: bounceIn 0.5s;
        }
        .btn-next:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0, 184, 148, 0.7); }
        .btn-restart {
            background: linear-gradient(135deg, var(--warning), var(--danger));
            color: white;
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.5);
        }
        .btn-restart:hover { transform: translateY(-3px); }

        .question-screen {
            gap: 1.5rem;
            padding: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .question-counter {
            font-size: 0.9rem;
            color: var(--secondary);
            letter-spacing: 2px;
        }

        /* Contador de intentos */
        .attempts-display {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            align-items: center;
        }
        .attempt-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--success);
            transition: all 0.3s;
        }
        .attempt-dot.lost {
            background: var(--danger);
            animation: successPop 0.4s;
        }
        .attempt-label {
            font-size: 0.8rem;
            color: var(--light);
            opacity: 0.6;
            margin-left: 0.5rem;
        }

        .idiom-display {
            background: rgba(108, 92, 231, 0.1);
            border: 2px solid var(--secondary);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            position: relative;
            transition: all 0.5s;
        }
        .idiom-display.celebrating {
            animation: rainbowBorder 1s infinite;
        }
        .idiom-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
            animation: float 2s infinite ease-in-out;
        }
        .idiom-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--warning);
            letter-spacing: 1px;
            line-height: 1.3;
        }
        .idiom-literal {
            font-size: 0.9rem;
            color: var(--light);
            opacity: 0.6;
            margin-top: 0.5rem;
            font-style: italic;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .option-btn {
            width: 100%;
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--light);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 1rem;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }
        .option-btn:not(.wrong):not(.correct):hover {
            background: rgba(108, 92, 231, 0.2);
            border-color: var(--secondary);
            transform: translateX(8px);
        }
        .option-btn:active { transform: scale(0.98); }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(108, 92, 231, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        /* Estados de opciones */
        .option-btn.wrong {
            background: rgba(225, 112, 85, 0.3) !important;
            border-color: var(--danger) !important;
            animation: wrongMark 0.5s;
            pointer-events: none;
            opacity: 0.7;
        }
        .option-btn.wrong .option-letter {
            background: var(--danger);
            color: white;
        }
        .option-btn.wrong::after {
            content: '✕';
            position: absolute;
            right: 1.2rem;
            font-size: 1.3rem;
            color: var(--danger);
            font-weight: bold;
        }

        .option-btn.correct {
            background: rgba(0, 184, 148, 0.3) !important;
            border-color: var(--success) !important;
            animation: correctGlow 1s ease-in-out 3, successPop 0.6s;
            pointer-events: none;
        }
        .option-btn.correct .option-letter {
            background: var(--success);
            color: white;
        }
        .option-btn.correct::after {
            content: '✓';
            position: absolute;
            right: 1.2rem;
            font-size: 1.5rem;
            color: var(--success);
            font-weight: bold;
            animation: bounceIn 0.5s;
        }

        /* Feedback overlay - solo para acierto */
        .feedback-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .feedback-overlay.show { opacity: 1; }

        .feedback-card {
            background: rgba(0, 0, 0, 0.95);
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            animation: bounceIn 0.6s;
            border: 3px solid var(--success);
            max-width: 420px;
            width: 90%;
        }
        .feedback-emoji { font-size: 5rem; display: block; animation: float 1s infinite ease-in-out; }
        .feedback-text { font-size: 1.4rem; margin: 1rem 0; font-weight: 700; color: var(--success); }

        /* Indicador de intentos en el feedback */
        .feedback-attempts {
            font-size: 0.9rem;
            color: var(--warning);
            margin-top: 0.5rem;
        }

        /* Results */
        .results-screen { gap: 1.5rem; padding: 1rem; }

        .score-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--success) var(--score-percent), rgba(255,255,255,0.1) 0);
            display: flex; align-items: center; justify-content: center;
            animation: bounceIn 0.8s;
        }
        .score-inner {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: var(--dark);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .score-number { font-size: 3rem; font-weight: 800; color: var(--warning); }
        .score-total { font-size: 1rem; color: var(--light); opacity: 0.7; }
        .results-message { font-size: 1.3rem; text-align: center; line-height: 1.6; }

        .results-detail {
            display: flex; flex-direction: column;
            gap: 0.8rem; width: 100%;
        }
        .result-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.8rem 1rem; border-radius: 12px;
            background: rgba(255,255,255,0.05);
        }
        .result-icon { font-size: 1.5rem; width: 35px; text-align: center; }
        .result-idiom { flex: 1; font-size: 0.9rem; }
        .result-answer { color: var(--accent); font-size: 0.85rem; }
        .result-attempts {
            font-size: 0.75rem;
            color: var(--warning);
            background: rgba(253, 203, 110, 0.15);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }

        /* Confeti */
        .confetti-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 200;
        }
        .confetti-piece {
            position: absolute;
            animation: confettiFall 3s linear forwards;
        }

        /* Mensaje flotante de "incorrecto" */
        .floating-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--danger);
            pointer-events: none;
            z-index: 50;
            animation: floatUp 1.5s forwards;
            text-shadow: 0 0 20px rgba(225, 112, 85, 0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title { font-size: 2rem; }
            .idiom-text { font-size: 1.5rem; }
            .idiom-emoji { font-size: 3rem; }
            .option-btn { padding: 1rem; font-size: 0.9rem; }
            .option-letter { width: 35px; height: 35px; font-size: 0.9rem; }
            .btn { padding: 0.8rem 2rem; font-size: 1rem; }
            .score-circle { width: 120px; height: 120px; }
            .score-inner { width: 95px; height: 95px; }
            .score-number { font-size: 2.5rem; }
            .feedback-card { padding: 1.8rem; }
            .feedback-emoji { font-size: 3.5rem; }
        }
        @media (max-width: 480px) {
            .game-title { font-size: 1.6rem; }
            .idiom-text { font-size: 1.3rem; }
            .idiom-emoji { font-size: 2.5rem; }
            .option-btn { padding: 0.8rem 1rem; font-size: 0.85rem; gap: 0.6rem; }
            .option-letter { width: 30px; height: 30px; font-size: 0.8rem; }
            .idiom-display { padding: 1.5rem; }
            .game-logo { font-size: 3.5rem; }
            .option-btn.wrong::after,
            .option-btn.correct::after { right: 0.8rem; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="confetti-container" id="confettiContainer"></div>

    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <span class="feedback-emoji" id="feedbackEmoji">🎉</span>
            <div class="feedback-text" id="feedbackText">¡Correcto!</div>
            <div class="feedback-attempts" id="feedbackAttempts"></div>
        </div>
    </div>

    <div class="game-container">

        <!-- INICIO -->
        <div class="screen start-screen active" id="startScreen">
            <div class="game-logo">🎯</div>
            <h1 class="game-title">ENGLISH IDIOMS</h1>
            <p class="game-subtitle">
                <br>
                Elige la traducción correcta. ¡Puedes intentar hasta encontrarla!
            </p>
            <div class="idioms-preview">
                <span class="idiom-chip">🐆 Leopard spots</span>
                <span class="idiom-chip">🎭 Blessing in disguise</span>
                <span class="idiom-chip">💰 Fool's money</span>
                <span class="idiom-chip">🐷 Pig lipstick</span>
                <span class="idiom-chip">👑 Man's home castle</span>
            </div>
            <button class="btn btn-primary" onclick="startGame()">▶ ¡COMENZAR!</button>
        </div>

        <!-- PREGUNTA -->
        <div class="screen question-screen" id="questionScreen">
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <p class="question-counter" id="questionCounter">Pregunta 1 de 5</p>
            <div class="attempts-display" id="attemptsDisplay">
                <span class="attempt-label">Intentos:</span>
                <div class="attempt-dot" id="dot1"></div>
                <div class="attempt-dot" id="dot2"></div>
                <div class="attempt-dot" id="dot3"></div>
                <div class="attempt-dot" id="dot4"></div>
            </div>
            <div class="idiom-display" id="idiomDisplay">
                <span class="idiom-emoji" id="idiomEmoji"></span>
                <h2 class="idiom-text" id="idiomText"></h2>
                <p class="idiom-literal" id="idiomLiteral"></p>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
            <button class="btn btn-next" id="nextBtn" style="display:none" onclick="nextQuestion()">SIGUIENTE →</button>
        </div>

        <!-- RESULTADOS -->
        <div class="screen results-screen" id="resultsScreen">
            <div class="game-logo">🏆</div>
            <h1 class="game-title">¡RESULTADOS!</h1>
            <div class="score-circle" id="scoreCircle">
                <div class="score-inner">
                    <span class="score-number" id="scoreNumber">0</span>
                    <span class="score-total">/ 5</span>
                </div>
            </div>
            <p class="results-message" id="resultsMessage"></p>
            <div class="results-detail" id="resultsDetail"></div>
            <button class="btn btn-restart" onclick="restartGame()">🔄 Inicio</button>
        </div>

    </div>

    <script>
        const idiomsData = [
            {
                idiom: "A leopard cannot change its spots",
                emoji: "🐆",
                literal: "(escoge la respuesta que crees que sea la correcta)",
                correct: "Genio y figura hasta la sepultura",
                wrong: [
                    "Más vale prevenir que lamentar",
                    "El que mucho abarca poco aprieta",
                    "A caballo regalado no se le miran los dientes",
                    "Camarón que se duerme se lo lleva la corriente"
                ]
            },
            {
                idiom: "A blessing in disguise",
                emoji: "🎭",
                literal: "(escoge la respuesta que crees que sea la correcta)",
                correct: "No hay mal que por bien no venga",
                wrong: [
                    "Dime con quién andas y te diré quién eres",
                    "El que ríe al último ríe mejor",
                    "Ojos que no ven, corazón que no siente",
                    "Del dicho al hecho hay mucho trecho"
                ]
            },
            {
                idiom: "A fool and his money are soon parted",
                emoji: "💰",
                literal: "(escoge la respuesta que crees que sea la correcta)",
                correct: "Lo que fácil viene, fácil se va",
                wrong: [
                    "Dinero llama dinero",
                    "El dinero no da la felicidad",
                    "Tanto tienes, tanto vales",
                    "Lo barato sale caro"
                ]
            },
            {
                idiom: "A pig with lipstick, is still a pig",
                emoji: "🐷",
                literal: "(escoge la respuesta que crees que sea la correcta)",
                correct: "Aunque la mona se vista de seda, mona se queda",
                wrong: [
                    "Más sabe el diablo por viejo que por diablo",
                    "No todo lo que brilla es oro",
                    "Zapatero a tus zapatos",
                    "De tal palo, tal astilla"
                ]
            },
            {
                idiom: "A man's home is his castle",
                emoji: "👑",
                literal: "(escoge la respuesta que crees que sea la correcta)",
                correct: "Mientras que en mi casa estoy, rey soy",
                wrong: [
                    "El que tiene tienda que la atienda",
                    "El que persevera alcanza",
                    "Donde manda capitán no gobierna marinero",
                    "Más vale solo que mal acompañado"
                ]
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let attemptsInQuestion = 0;
        let maxAttempts = 4;
        let userAnswers = [];

        function startGame() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            switchScreen('startScreen', 'questionScreen');
            loadQuestion();
        }

        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(toId).classList.add('active');
        }

        function loadQuestion() {
            if (currentQuestion >= idiomsData.length) {
                showResults();
                return;
            }

            attemptsInQuestion = 0;
            const data = idiomsData[currentQuestion];

            document.getElementById('progressFill').style.width = `${(currentQuestion / idiomsData.length) * 100}%`;
            document.getElementById('questionCounter').textContent = `Pregunta ${currentQuestion + 1} de ${idiomsData.length}`;
            document.getElementById('idiomEmoji').textContent = data.emoji;
            document.getElementById('idiomText').textContent = data.idiom;
            document.getElementById('idiomLiteral').textContent = data.literal;

            // Reset del idiom display
            const idiomDisplay = document.getElementById('idiomDisplay');
            idiomDisplay.classList.remove('celebrating');

            // Reset dots de intentos
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                dot.classList.remove('lost');
            }

            const allOptions = [data.correct, ...data.wrong];
            const shuffled = shuffleArray([...allOptions]);
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E'];

            shuffled.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="option-letter">${letters[index]}</span>
                    <span>${option}</span>
                `;
                btn.addEventListener('click', () => selectOption(btn, option, data.correct));
                optionsGrid.appendChild(btn);
            });

            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('feedbackOverlay').classList.remove('show');
        }

        function selectOption(btn, selected, correct) {
            // Si ya acertó esta pregunta, no permitir más clicks
            if (btn.classList.contains('correct')) return;
            // Si esta opción ya fue marcada como incorrecta, no hacer nada
            if (btn.classList.contains('wrong')) return;

            if (selected === correct) {
                // ¡ACERTÓ!
                btn.classList.add('correct');
                score++;
                userAnswers[currentQuestion] = { correct: true, attempts: attemptsInQuestion + 1 };

                // Deshabilitar todas las opciones
                const allOptions = document.querySelectorAll('.option-btn');
                allOptions.forEach(opt => opt.style.pointerEvents = 'none');

                // Efecto de celebración en el idiom display
                const idiomDisplay = document.getElementById('idiomDisplay');
                idiomDisplay.classList.add('celebrating');

                // Mostrar feedback de éxito
                showSuccessFeedback(attemptsInQuestion + 1);

                // Confeti
                createConfetti();
                setTimeout(createConfetti, 600);

                // Mostrar botón siguiente
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.style.display = 'block';
                nextBtn.style.animation = 'bounceIn 0.5s';

            } else {
                // Falló - marcar solo esta opción como incorrecta
                btn.classList.add('wrong');
                btn.style.pointerEvents = 'none';
                attemptsInQuestion++;

                // Actualizar dots de intentos
                const dot = document.getElementById(`dot${attemptsInQuestion}`);
                if (dot) dot.classList.add('lost');

                // Mostrar mensaje flotante de incorrecto
                showFloatingMessage('¡Incorrecto! 😅');

                // Si ya gastó todos los intentos, revelar la correcta
                if (attemptsInQuestion >= maxAttempts) {
                    userAnswers[currentQuestion] = { correct: false, attempts: attemptsInQuestion };
                    const allOptions = document.querySelectorAll('.option-btn');
                    allOptions.forEach(opt => {
                        if (opt.querySelector('span:last-child').textContent === correct) {
                            opt.classList.add('correct');
                        }
                        opt.style.pointerEvents = 'none';
                    });

                    // Mostrar feedback de que se acabaron los intentos
                    setTimeout(() => {
                        showOutOfAttemptsFeedback(correct);
                    }, 800);

                    // Mostrar botón siguiente
                    const nextBtn = document.getElementById('nextBtn');
                    nextBtn.style.display = 'block';
                    nextBtn.style.animation = 'bounceIn 0.5s';
                }
            }
        }

        function showFloatingMessage(message) {
            const msg = document.createElement('div');
            msg.className = 'floating-message';
            msg.textContent = message;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 1600);
        }

        function showSuccessFeedback(attempts) {
            const overlay = document.getElementById('feedbackOverlay');
            const emoji = document.getElementById('feedbackEmoji');
            const text = document.getElementById('feedbackText');
            const attemptsText = document.getElementById('feedbackAttempts');

            const emojis = ['🎯', '👑', '🌟', '🔥'];
            emoji.textContent = emojis[Math.min(attempts - 1, 3)];
            text.textContent = '¡Correcto!';
            text.style.color = '#00b894';

            if (attempts === 1) {
                attemptsText.textContent = '¡A la primera! ¡Impresionante!';
            } else if (attempts === 2) {
                attemptsText.textContent = '¡Bien! Solo necesitaste 2 intentos';
            } else if (attempts === 3) {
                attemptsText.textContent = '¡Lo lograste en 3 intentos!';
            } else {
                attemptsText.textContent = '¡Al final lo conseguiste!';
            }

            overlay.classList.add('show');

            setTimeout(() => {
                overlay.classList.remove('show');
            }, 2500);
        }

        function showOutOfAttemptsFeedback(correct) {
            const overlay = document.getElementById('feedbackOverlay');
            const emoji = document.getElementById('feedbackEmoji');
            const text = document.getElementById('feedbackText');
            const attemptsText = document.getElementById('feedbackAttempts');

            emoji.textContent = '📚';
            text.textContent = '¡Se acabaron los intentos!';
            text.style.color = '#e17055';
            attemptsText.textContent = `La respuesta correcta es: ${correct}`;

            overlay.classList.add('show');

            setTimeout(() => {
                overlay.classList.remove('show');
            }, 3000);
        }

        function nextQuestion() {
            currentQuestion++;
            document.getElementById('feedbackOverlay').classList.remove('show');
            loadQuestion();
            document.getElementById('questionScreen').scrollTop = 0;
        }

        function showResults() {
            switchScreen('questionScreen', 'resultsScreen');
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('scoreNumber').textContent = score;

            const percent = (score / idiomsData.length) * 100;
            document.getElementById('scoreCircle').style.background =
                `conic-gradient(var(--success) ${percent * 3.6}deg, rgba(255,255,255,0.1) 0)`;

            const messages = [
                '¡Sigue practicando! Los idioms son difíciles. 📚',
                '¡Vas por buen camino! 💪',
                '¡Buen trabajo! Conoces varios idioms. 🌟',
                '¡Muy bien! Casi los dominas todos. 🔥',
                '¡Excelente! 👑',
                '¡PERFECTO! ¡Los sabes todos! 🏆'
            ];
            document.getElementById('resultsMessage').textContent = messages[score];

            const detail = document.getElementById('resultsDetail');
            detail.innerHTML = '';
            idiomsData.forEach((data, index) => {
                const userAnswer = userAnswers[index];
                const icon = userAnswer && userAnswer.correct ? '✅' : '❌';
                const attempts = userAnswer ? userAnswer.attempts : '-';
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <span class="result-icon">${icon}</span>
                    <span class="result-idiom">${data.emoji} ${data.idiom}</span>
                    <span class="result-answer">→ ${data.correct}</span>
                    <span class="result-attempts">${attempts} ${attempts === 1 ? 'intento' : 'intentos'}</span>
                `;
                detail.appendChild(item);
            });

            if (score >= 4) {
                setTimeout(createConfetti, 500);
                setTimeout(createConfetti, 1000);
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
            document.getElementById('progressFill').style.width = '0%';
            switchScreen('resultsScreen', 'questionScreen');
            loadQuestion();
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = [
                '#6c5ce7', '#00cec9', '#fdcb6e', '#fd79a8',
                '#00b894', '#e17055', '#a29bfe', '#55efc4',
                '#ff7675', '#74b9ff', '#ffeaa7', '#fab1a0'
            ];

            for (let i = 0; i < 70; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = -(Math.random() * 30 + 10) + 'px';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's';
                piece.style.animationDelay = Math.random() * 0.8 + 's';
                const size = Math.random() * 10 + 8;
                piece.style.width = size + 'px';
                piece.style.height = size + 'px';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                piece.style.opacity = Math.random() * 0.7 + 0.3;
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 4000);
            }
        }

        console.log('🎯 English Idioms Game - ¡Listo para jugar!');
        console.log('📌 5 idioms desafiantes');
        console.log('🔄 Puedes intentar hasta 4 veces por pregunta');
        console.log('✅ Solo al acertar: confeti + celebración');
        console.log('❌ Incorrectas se acumulan en rojo');
    </script>
</body>
</html>
